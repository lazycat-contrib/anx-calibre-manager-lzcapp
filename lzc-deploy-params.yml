params:
  - id: calibre_username
    type: string
    name: "calibre username"
    description: "the calibre username to  set for login(DONOT USE EMAIL AND SPECIAL CHARACRORS)"
    default_value: "admin"
    optional: false

  - id: calibre_password
    type: secret
    name: "calibre password"
    description: "the calibre password you want to set for login"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    calibre_username:
      name: "calibre用户名"
      description: "您要设置登录的calibre用户名(不要使用邮箱和特殊字符)"

    calibre_password:
      name: "calibre密码"
      description: "您要设置登录的calibre密码"
