version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: anx-calibre-manager

build:
  run_buildscript: false

images:
  - id: anx-calibre-manager
    target: service
    service: anx-calibre-manager-aio
    source: ghcr.io/ptbsare/anx-calibre-manager
    channel: stable
    sort: semver
    tag_regex: '^aio-\d+\.\d+\.\d+$'
    version_regex: '^aio-(?P<version>\d+\.\d+\.\d+)$'
    version_template: '{version}'
    delivery:
      mode: lazycat

  - id: calibre-web-automated
    target: service
    service: calibre-web-automated
    source: ghcr.io/crocodilestick/calibre-web-automated
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: Anx Calibre Manager
      source: https://github.com/ptbsare/anx-calibre-manager
      source_author: ptbsare
  private:
    enabled: true
    skip_if_version_exists: true
    name: Anx Calibre Manager
    summary: 由 GitHub Actions 自动发布
